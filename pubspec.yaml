name: urungano
description: URUNGANO — ReproHealth 3D educational platform for sexual and reproductive health.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Routing
  go_router: ^14.2.7

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0

  # Text-to-speech (narration) + audio playback for server-synthesized MP3
  flutter_tts: ^4.2.0
  just_audio: ^0.9.40

  # Speech-to-text (voice input in EN/FR/RW)
  speech_to_text: ^6.6.2

  # Camera (gesture control)
  camera: ^0.11.0+2

  # Networking (backend API)
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Security (PIN hashing)
  crypto: ^3.0.3

  # Utilities
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  equatable: ^2.0.7
  model_viewer_plus: ^1.10.0
  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  
  # Testing framework dependencies
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1
  patrol: ^3.12.0
  golden_toolkit: ^0.15.0
  
  # Test coverage and utilities
  test: ^1.25.8
  fake_async: ^1.3.1
  clock: ^1.1.1

flutter:
  uses-material-design: true
  generate: true
