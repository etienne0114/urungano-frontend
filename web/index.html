  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description" content="Urungano — an immersive, multilingual sexual and reproductive health education platform for young people in Rwanda and beyond.">

  <meta name="apple-mobile-web-app-title" content="Urungano">

    const firebaseConfig = {

      projectId: "urungano-60a69",

</head>
<body>
  <!-- Splash loader shown before Flutter boots -->
  <style>
    body { margin: 0; background: #FFF0F4; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #FFF0F4 0%, #FDF4EC 100%);
      font-family: sans-serif; z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #splash .logo {
      width: 80px; height: 80px;
      background: #E8A4B8;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(232,164,184,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    #splash .logo span { font-size: 36px; }
    #splash h1 { color: #5C2D5E; font-size: 22px; font-weight: 600; margin: 0 0 6px; }
    #splash p  { color: #9a7a9a; font-size: 13px; margin: 0; }
    #splash .bar {
      width: 120px; height: 3px;
      background: #E8A4B8; border-radius: 2px;
      margin-top: 24px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  </style>
  <div id="splash">
    <div class="logo"><span>🌸</span></div>
    <h1>Urungano</h1>
    <p>Immersive Health Education</p>
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('splash');
      if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.remove(), 400); }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
